<!DOCTYPE html>
<html lang="javascriptreact">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Papers</title>
  <link rel="stylesheet" href="allPapers.css">
</head>

<body>
  <button class="dashboard-btn" id="dashboard-btn"><i class="fa-solid fa-arrow-left"></i> Back <span
      class="remove-mobile">to Dashboard</span></button>
  <div class="main-heading">
    <h1>All Papers</h1>
    <p>View all submitted papers</p>
    <span id="page-number">1</span>
  </div>
  <div class="btns-container">
    <div class="left-btn-container">
      <button id="left-btn"><i class="fa-solid fa-arrow-left"></i> <span class="remove-mobile">Prev</span></button>
    </div>
    <div class="right-btn-container">
      <button id="right-btn"><span class="remove-mobile">Next</span> <i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </div>
  <div class="review-papers-container">
    <!-- dynamically create paper cards in javascript -->
  </div>
  <!-- <div class="right-btn-container">
    <button id="right-btn">Next <i class="fa-solid fa-arrow-right"></i></button>
  </div> -->

  <!-- if papers are not submitted by user -->
  <div class="review-papers-available-container">
    <i class="fa-regular fa-file"></i>
    <h1>No Papers Yet</h1>
    <p>Students haven't submitted any research papers</p>
  </div>
  <!-- select teacher container -->
  <div class="select-teacher-container">
    <div class="paper-title-container">
      <div class="paper-title-left-data">
        <span>Paper Title: </span>
        <span>AI Research on ML</span>
      </div>
      <div class="paper-title-right-data">
        <i class="fa-solid fa-xmark" id="x-mark"></i>
      </div>
    </div>
    <p class="teacher-para">Select Teacher:</p>
    <div class="teachers-option-container">
      <!-- dynamically create -->
    </div>
    <div class="teacher-credentials-container">
      <!-- dynamically create -->
    </div>
    <div class="btns-container">
      <button class="assign-btn">Assign</button>
      <button class="cancel-btn">Cancel</button>
    </div>
  </div>
  <script src="https://kit.fontawesome.com/1d8804d5ad.js" crossorigin="anonymous"></script>
  <script src="../shared/config.js"></script>
  <script src="allPapers.js"></script>
</body>

</html>
