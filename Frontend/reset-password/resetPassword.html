<!DOCTYPE html>
<html lang="javascriptreact">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="resetPassword.css">
</head>
<body>
  <div class="main-reset-password-container">
    <button class="back-btn"><i class="fa-solid fa-arrow-left"></i>Back</button>
    <div class="reset-password-upper-container">
      <div class="lock-container">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2>Reset Your Password</h2>
      <p class="para">Enter your new password below.</p>
    </div>
    <div class="reset-password-lower-container">
      <label for="password">New Password</label>
      <div class="password-container">
        <i class="fa-solid fa-lock"></i>
        <input type="password" name="password" id="password" placeholder="Enter new password" required>
        <i class="fa-solid fa-eye"></i>
      </div>
      <label for="confirm-password">Confirm New Password</label>
      <div class="confirm-password-container">
        <i class="fa-solid fa-lock"></i>
        <input type="password" name="confirm-password" id="confirm-password" placeholder="Confirm new password" required>
        <i class="fa-solid fa-eye"></i>
      </div>
    </div>
    <button class="reset-password-btn">Reset Password</button>
  </div>
  
</body>

<script src="https://kit.fontawesome.com/1d8804d5ad.js" crossorigin="anonymous"></script>
<script src="../shared/config.js"></script>
<script src="resetPassword.js"></script>
</html>
