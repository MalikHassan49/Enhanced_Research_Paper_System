<!DOCTYPE html>
<html lang="javascriptreact">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="forgotPassword.css">
</head>

<body>
  <div class="reset-password-container">
    <button class="arrow-left-btn"><i class="fa-solid fa-arrow-left"></i>Back to Sign In</button>
    <div class="reset-password-upper-container">
      <div class="message-icon-container">
        <i class="fa-solid fa-envelope"></i>
      </div>
      <div class="forgot-password-container">
        <h2>Forgot Password&#63;</h2>
        <p>No worries! Enter your email address and <br> we'll send you a verification code.</p>
      </div>
    </div>
    <div class="email-container">
      <label for="email">Email Address</label>
      <div class="input-container">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="userEmail" name="email" placeholder="Enter your email">
      </div>
    </div>
    <button class="send-btn">Send Code</button>
    <div class="shield-container">
      <i class="fa-solid fa-shield-halved"></i>
      <p class="para">We'll never share your email with anyone else.</p>
    </div>
  </div>
</body>

<script src="https://kit.fontawesome.com/1d8804d5ad.js" crossorigin="anonymous"></script>
<script src="../shared/config.js"></script>
<script src="forgotPassword.js"></script>

</html>
