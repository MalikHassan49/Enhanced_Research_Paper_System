<!DOCTYPE html>
<html lang="javascriptreact">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviewed Papers</title>
  <link rel="stylesheet" href="reviewedPapers.css">
</head>

<body>
  <button class="dashboard-btn" id="dashboard-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</button>
  <div class="main-heading">
    <h1>Reviewed Papers</h1>
    <p>Papers you have reviewed</p>
  </div>
  <div class="reviews-container">
    <!-- dynamically create paper cards in javascript -->
  </div>
  <!-- if papers are not submitted by user -->
   <div class="reviews-available-container">
    <i class="fa-regular fa-file"></i>
    <h1>No Papers Yet</h1>
    <p>You haven't reviewed any research papers</p>
    <button>REVIEW YOUR FIRST PAPER</button>
  </div>
  <!-- teacher comment -->
   <div class="teacher-comment-container">
    <!-- dynamically create -->
   </div>
  <script src="https://kit.fontawesome.com/1d8804d5ad.js" crossorigin="anonymous"></script>
  <script src="reviewedPapers.js"></script>
</body>

</html>
