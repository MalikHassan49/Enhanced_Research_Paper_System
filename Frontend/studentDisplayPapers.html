<!DOCTYPE html>
<html lang="javascriptreact">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Papers</title>
  <link rel="stylesheet" href="studentDisplayPapers.css">
</head>
<body>
  <button class="dashboard-btn"><i class="fa-solid fa-arrow-left"></i> Back <span class="remove-mobile">to Dashboard</span></button>
  <div class="main-heading">
    <h1>My Research Papers</h1>
    <p>View all your submitted papers</p>
  </div>
  <div class="papers-container">
    <i class="fa-regular fa-file"></i>
    <h1>No Papers Yet</h1>
    <p>You haven't submitted any research papers</p>
    <button>SUBMIT YOUR FIRST PAPER</button>
  </div>
  <script src="https://kit.fontawesome.com/1d8804d5ad.js" crossorigin="anonymous"></script>
</body>
</html>
