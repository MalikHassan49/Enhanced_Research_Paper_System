<!DOCTYPE html>
<html lang="javascriptreact">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submitted Papers</title>
  <link rel="stylesheet" href="studentAllpapers.css">
</head>

<body>
  <button class="dashboard-btn" id="dashboard-btn"><i class="fa-solid fa-arrow-left"></i> Back <span class="remove-mobile">to Dashboard</span></button>
  <div class="main-heading">
    <h1>My Research Papers</h1>
    <p>View all your submitted papers</p>
  </div>
  <div class="papers-container">
    <!-- dynamically create paper cards in javascript -->
  </div>
  <!-- if papers are not submitted by user -->
   <div class="papers-available-container">
    <i class="fa-regular fa-file"></i>
    <h1>No Papers Yet</h1>
    <p>You haven't submitted any research papers</p>
    <button id="submit-first-paper-btn">SUBMIT YOUR FIRST PAPER</button>
  </div>
  <!-- teacher comment -->
   <div class="teacher-comment-container">
    
   </div>
  <script src="https://kit.fontawesome.com/1d8804d5ad.js" crossorigin="anonymous"></script>
  <script src="../shared/config.js"></script>
  <script src="studentAllPapers.js"></script>
</body>

</html>
